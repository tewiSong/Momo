dataset:
  preprocessed_path: data/pcqm4m_v2_motif_preprocessed.pkl
  batch_size: 16
  num_workers: 4
  shuffle: true
  max_atomic_num: 100  # 原子编号上限（用于Embedding大小），断言会检查输入不越界
  val_ratio: 0.05      # 训练/验证划分比例

model:
  hidden_dim: 256
  edge_target_dim: 7
  num_gin_layers: 5
  gin_mlp_hidden: 256
  dropout: 0.1
  z3d_dim: 256          # teacher 主干 hidden（不再作为监督维度）
  codebook_size: 128
  expert_mlp_hidden: 256
  num_experts: 8        # 独立 expert 数量（MoE）
  readout: sum          # sum 或 attention
  delta_scale: 0.2      # 固定缩放 γ，限制 Δ 的容量
  ctx_delta_scale: 0.1  # 弱上下文补充分支，只负责 edge_delta 表达不了的剩余信息
  ctx_delta_bottleneck: 64
  motif_edge_dim: 8
  neighbor_type_vocab_size: 1000000
  neighbor_type_emb_dim: 16
  codebook_init:
    name: kmeans        # 对 teacher motif latent（无 teacher 时退化为 encoder latent）做 k-means 初始化 codebook
    sample_size: 200000
    max_iters: 30
    tol: 1.0e-4

loss:
  edge_weight: 0.5
  main_3d_weight: 1.0
  template_weight: 1.0
  vq_weight: 0.25
  commit_weight: 0.25
  commit_ramp_steps: 200000
  delta_l2_weight: 0.001
  orth_weight: 0.02
  ctx_delta_l2_weight: 0.001
  ctx_delta_orth_weight: 0.02

optim:
  lr: 1e-3

misc:
  device: cuda
  epochs: 50
  log_every_steps: 50
  eval_every_epochs: 1
  eval_every_steps: 5000   # 额外按步评估，并用 global_step 记录
  seed: 42
  log_dir: runs
  save_dir: checkpoints
  save_every_epochs: 5
  resume: ""   # 为空则不恢复；或填写 ckpt 路径
  use_amp: true
  grad_clip_norm: 1.0   # 梯度裁剪上限（>0 启用）
  save_best_only: false   # 仅保存 best 与 last
  early_stop_patience: 0  # 0 表示关闭 early stopping
  min_delta: 0.0          # 最小改进阈值（用于 early stopping 与 best）

scheduler:
  name: cosine      # 可选：none|step|plateau|cosine
  eta_min: 1.0e-5

router:
  teacher_temperature: 2.0
  teacher_temperature_start: 2.0
  teacher_temperature_end: 1.2
  teacher_temp_decay_start: 10000
  teacher_temp_decay_steps: 60000
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.6
  warmup_steps: 50000
  tau_r_boost:
    start_step: 200000
    duration: 100000
    end_tau: 0.60

teacher:
  enabled: true
  # 从根源修复：先只训练投影层对齐到 z_gt，teacher 主干默认冻结
  trainable: false
  proj_trainable: true
  hidden_dim: 256
  num_filters: 128
  num_interactions: 6
  num_gaussians: 50
  cutoff: 10.0
  # 稳定性与参考实现对齐项
  max_num_neighbors: 32
  normalize_messages: true
  activation: shifted_softplus
